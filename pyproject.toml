[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-recovery"
version = "0.5.0"
description = "Exposure-gated recovery, cyclic dosing and conditional restart simulations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["logos", "pharmacokinetics", "pharmacodynamics", "pkpd", "dose-optimization", "dosing-regimens", "mathematical-modeling", "computational-pharmacology", "model-informed-precision-dosing", "treatment-optimization", "drug-safety"]
classifiers = ["Programming Language :: Python :: 3.12", "Topic :: Scientific/Engineering"]
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "pandas==2.2.3", "matplotlib==3.10.9"]

[project.scripts]
logos-reproduce = "logos_recovery.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
