name: Clean scientific reproduction
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python scripts/verify_manifest.py
      - run: python -m unittest discover -s tests -v
      - run: logos-reproduce --output results
      - run: python scripts/verify_outputs.py results
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-python-3.12
          path: results/
